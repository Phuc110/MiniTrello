name: Build and Publish Docker Images

# Separate from ci.yml deliberately: publishing an image is a
# deployment action with real side effects (a new tag becomes pullable),
# so it only runs on merges to main after CI has already passed on that
# commit via branch protection — not on every PR.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Build and push (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      # ghcr.io tags must be lowercase; github.repository preserves case
      # (e.g. Phuc110/MiniTrello), so derive an all-lowercase namespace.
      - name: Compute image namespace
        id: meta
        run: echo "namespace=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.namespace }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.namespace }}/${{ matrix.service }}:${{ github.sha }}
