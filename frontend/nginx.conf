server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Defense-in-depth headers — cheap to add, standard for any
    # production-facing static host. CSP is deliberately not set here
    # since it needs to be tuned per-deployment (CDN domains, API origin,
    # etc.) rather than hardcoded into a template config.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Lightweight endpoint for the container HEALTHCHECK and for a load
    # balancer's health probe — doesn't touch the backend or exercise the
    # SPA fallback, so it stays fast and cheap even under load.
    location /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # SPA fallback — React Router owns client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the backend container so the browser
    # only ever talks to one origin (avoids CORS entirely in production).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
